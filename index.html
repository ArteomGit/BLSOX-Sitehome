<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLSOX — A New Era of Sox is Coming</title>
<meta name="description" content="BLSOX. Comfort Sox.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Aileron';
    src:url('Aileron-Regular.otf') format('opentype');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --bg-base:   #121110;
    --bg-deep:   #0a0908;
    --steel:     #4d4a42;
    --oxide:     #a8582f;
    --oxide-dim: #6e3a20;
    --paper:     #ece5d6;
    --paper-dim: rgba(236,229,214,0.56);
    --line:      rgba(236,229,214,0.09);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-base);
    color:var(--paper);
    font-family:'Archivo', sans-serif;
    overflow:hidden;
  }

  .bg-base{
    position:fixed;
    inset:0;
    z-index:0;
    background:#000;
  }

  .page{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
  }

  .hero{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4vh 6vw 2vh;
  }

  .bg-mark{
    position:absolute;
    top:50%;
    left:50%;
    width:min(150vw, 1400px);
    height:min(150vw, 1400px);
    transform:translate(-50%,-52%) rotate(-8deg);
    border:1.5px solid rgba(236,229,214,0.05);
    pointer-events:none;
  }

  .bg-mark::before{
    content:"";
    position:absolute;
    top:8%;
    left:8%;
    right:8%;
    bottom:8%;
    border:1px solid rgba(236,229,214,0.035);
  }

  .photo-band{
    position:relative;
    flex:0 0 auto;
    width:100%;
    height:clamp(240px, 48vh, 520px);
    overflow:hidden;
  }

  .photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 15%;
    filter:grayscale(0.55) saturate(0.7) contrast(1.05) brightness(0.88);
    display:block;
  }

  .photo-fade{
    position:absolute;
    inset:0;
    background:linear-gradient(
      to bottom,
      #000 0%,
      rgba(0,0,0,0.7) 12%,
      rgba(0,0,0,0.22) 32%,
      rgba(0,0,0,0) 55%,
      rgba(0,0,0,0) 80%,
      rgba(0,0,0,0.5) 100%
    );
  }

  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
  }

  .bg-grain{
    position:absolute;
    inset:-50px;
    opacity:0.5;
    mix-blend-mode:overlay;
  }

  .bg-vignette{
    position:absolute;
    inset:0;
    box-shadow: inset 0 0 18vw 2vw rgba(0,0,0,0.65);
  }

  .content{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .logo{
    width:clamp(240px, 42vw, 560px);
    height:auto;
    color:var(--paper);
    display:block;
  }

  .notice{
    margin-top:clamp(24px, 4.5vw, 38px);
    font-family:'Syne Mono', monospace;
    font-size:clamp(0.7rem, 1.35vw, 0.88rem);
    letter-spacing:0.04em;
    line-height:1.7;
    color:var(--oxide);
  }

  .mail-link{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid transparent;
    cursor:pointer;
    transition:border-color .2s ease;
  }
  .mail-link:hover,
  .mail-link:focus-visible{
    border-color:currentColor;
  }

  .tagline{
    margin-top:clamp(12px, 2vw, 18px);
    font-family:'Aileron', 'Archivo', sans-serif;
    font-weight:400;
    font-size:clamp(0.82rem, 1.6vw, 1.05rem);
    letter-spacing:0.16em;
    color:var(--paper-dim);
  }

  footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:3;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px clamp(20px, 4vw, 40px);
    font-family:'Aileron', 'Archivo', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--paper-dim);
    border-top:1px solid var(--line);
  }

  footer a{
    color:var(--paper-dim);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .2s ease, color .2s ease;
  }
  footer a:hover{
    color:var(--paper);
    border-color:var(--oxide);
  }

  @media (max-width: 480px){
    footer{ font-size:0.66rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .content{ animation:none; }
  }
</style>
</head>
